name: Build Windows Docker images

on:
  workflow_dispatch:

# Permissions for GITHUB_TOKEN
permissions:
  # Required for actions/checkout
  contents: read
  # Required to save Docker containers to the GitHub container registry
  packages: write

# Windows containers can't be built with buildx/bake, at least in GHA
jobs:
  docker-windows:
    runs-on: windows-2025

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and push
        shell: bash
        env:
          IMAGE: ghcr.io/anarthal/cpp-ci-containers/build-msvc
          VERSION: 1
        run: |
          set -e
          docker build \
            -f images/build-msvc.dockerfile \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$VERSION" \
            .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
